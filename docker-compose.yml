services:
  # ------------------------------------------------------------
  # 开发数据库：仅当只想用 Docker 起 Postgres 开发环境时:
  #   docker compose up -d db
  # 然后本机 cd backend && go run . 默认连 localhost:5432
  #   (用户/密码/库均为 jasper)
  # ------------------------------------------------------------
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: jasper
      POSTGRES_PASSWORD: jasper
      POSTGRES_DB: jasper
      # md5 认证以配合 backend/internal/pgpool（纯标准库客户端）
      POSTGRES_HOST_AUTH_METHOD: md5
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jasper -d jasper"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ------------------------------------------------------------
  # 后端 + 前端静态托管（单镜像一键部署）:
  #   docker compose up --build -d   ->  http://localhost:8080
  # ------------------------------------------------------------
  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    # 连接库的 C 项放 environment（优先级高于 env_file，避免被 .env 覆盖）
    environment:
      PORT: "8080"
      PGHOST: db
      PGPORT: "5432"
      PGUSER: jasper
      PGPASSWORD: jasper
      PGDATABASE: jasper
    # 模型 / RAG / 管理员配置从宿主机 backend/.env 注入，不打进镜像
    env_file:
      - ./backend/.env
    ports:
      - "8080:8080"

volumes:
  pgdata: